# To run manually: go to your repo → Actions → Playwright Tests → Run workflow → choose your parameters → Run.

name: 🎭 Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Saturday 12:00 AM EST (05:00 UTC). GitHub cron runs in UTC; during EDT this fires at 1:00 AM local.
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: "test:e2e"
      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"
      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"

jobs:
  test:
    timeout-minutes: 60
    # Self-hosted: fakestoreapi.com (Cloudflare) returns 403 to GitHub-hosted runner IPs
    runs-on: [self-hosted, windows]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: ⚙️ Create .env File
        run: Copy-Item .env.example .env

      - name: 🔍 Check API Reachability
        continue-on-error: true
        run: |
          # Shows the status and first lines of the body, e.g. a Cloudflare block page when the runner IP is blocked
          curl.exe -s -i https://fakestoreapi.com/products/1 | Select-Object -First 25

      - name: 🧪 Run Playwright Tests
        run: |
          # Scheduled runs have no inputs, so they run the full @master suite
          $suite = "${{ github.event.inputs.test_suite || (github.event_name == 'schedule' && 'test:master') || 'test:e2e' }}"
          $browser = "${{ github.event.inputs.browser || 'chromium' }}"
          $mode = "${{ github.event.inputs.mode || 'headless' }}"
          $tag = $suite -replace 'test:', ''
          $browserFlag = "--project=$browser"
          $modeFlag = if ($mode -eq 'headed') { '--headed' } else { '' }
          # No --reporter flag: it would replace the config reporters, so no HTML/Allure/custom report gets written
          npx playwright test --grep "@$tag" $browserFlag $modeFlag --output=test-results
        env:
          CI: "1"
          # dotenv does not override variables already set, so these take precedence over .env.example placeholders
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL || 'https://awesomeqa.com/ui/' }}

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 30

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report
          path: custom-report/
          retention-days: 30

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
